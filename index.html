<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Straw Hat Ledger</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <div class="wrap">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="header-left">
                <img src="public/logo/strawHatLogo.png" width="40" height="40" />
                <h1>Pirates To-Do List</h1>
                <span class="sub">⚓</span>
            </div>
            <div class="header-right">
                <div class="date-box">
                    <span class="num" id="dayNum">22</span>
                    <div class="info">
                        <strong id="dayName">Tuesday</strong>
                        <span id="monthYear">Aug 2026</span>
                    </div>
                </div>
                <span class="flag-wrap">🏴‍☠️</span>
            </div>
        </div>

        <!-- ===== STATS ===== -->
        <div class="stats">
            <div class="stat-card"><div class="number" id="statOpen">0</div><div class="label">Open Tasks</div></div>
            <div class="stat-card"><div class="number" id="statDone">0</div><div class="label">Done Today</div></div>
            <div class="stat-card"><div class="number" id="statOverdue">0</div><div class="label">Overdue</div></div>
            <div class="stat-card"><div class="number" id="statPct">0%</div><div class="label">Completion</div></div>
        </div>

        <!-- ===== TIMERS ===== -->
        <div class="timer-row">
            <!-- Focus Timer -->
            <div class="timer-box" id="focusBox">
                <div class="head">
                    <span class="label"><span class="dot"></span> Focus Timer</span>
                    <div class="custom">
                        <input type="number" id="customMins" min="0" max="180" value="25" />
                        <span>min</span>
                        <input type="number" id="customSecs" min="0" max="59" value="0" />
                        <span>sec</span>
                        <button class="set-btn" id="setTimerBtn">Set</button>
                    </div>
                </div>
                <div class="big" id="focusDisplay">25:00</div>
                <div class="controls">
                    <button class="btn-start" id="focusStart">▶ Start</button>
                    <button class="btn-pause" id="focusPause">⏸ Pause</button>
                    <button class="btn-reset" id="focusReset">↺ Reset</button>
                </div>
                <div class="presets">
                    <button data-mins="5">5m</button>
                    <button data-mins="15">15m</button>
                    <button data-mins="25" class="active">25m</button>
                    <button data-mins="45">45m</button>
                    <button data-mins="60">60m</button>
                </div>
            </div>

            <!-- Work Hours -->
            <div class="timer-box" id="workBox">
                <div class="head">
                    <span class="label"><span class="dot"></span> Work Hours</span>
                    <div class="work-stats">
                        <span>Today <strong id="workToday">0h 0m</strong></span>
                        <span>Total <strong id="workTotal">0h 0m</strong></span>
                    </div>
                </div>
                <div class="big" id="workDisplay">00:00:00</div>
                <div class="controls">
                    <button class="btn-start" id="workStart">▶ Start</button>
                    <button class="btn-stop" id="workStop" style="display:none;">⏹ Stop</button>
                    <button class="btn-reset" id="workReset">↺ Reset</button>
                </div>
            </div>
        </div>

        <!-- ===== TASK INPUT ===== -->
        <div class="task-input-area">
            <textarea id="taskInput" placeholder="What needs doing, captain?"></textarea>
            <div class="row">
                <select id="prioritySelect">
                    <option value="high">🔥 High</option>
                    <option value="med" selected>⚖️ Medium</option>
                    <option value="low">🍃 Low</option>
                </select>
                <input type="date" id="dueInput" />
                <button class="add-btn" id="addBtn">➕ Add Task</button>
            </div>
        </div>

        <!-- ===== TASK LISTS ===== -->
        <!-- Checking comment-->
        <div class="lists">
            <!-- Pending -->
            <div class="list-col">
                <div class="list-head">
                    <h3>⚔️ Pending</h3>
                    <span class="count" id="pendingCount">0</span>
                </div>
                <div class="list-body" id="pendingList"></div>
            </div>

            <!-- Completed -->
            <div class="list-col">
                <div class="list-head">
                    <h3>🏆 Completed</h3>
                    <span class="count" id="completedCount">0</span>
                </div>
                <div class="list-body" id="completedList"></div>
                <button class="clear-btn" id="clearBtn">Clear All</button>
            </div>
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            <div class="left"><span class="heart">❤</span> Built by a SahiZo</div>
            <div class="right">
                <span class="jp">ワンピースは実在する</span>
                <span class="flag">🏴‍☠️</span>
                <span style="font-size:13px; color:#5a4a3a; font-weight:400;">"One Piece is Real"</span>
            </div>
        </div>

    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal" id="historyModal">
        <div class="card">
            <h2>📜 Task History</h2>
            <div id="historyContent"></div>
            <button class="close-btn" id="modalClose">Close</button>
        </div>
    </div>

    <script src="javaScript/app.js"></script>
    <script src="javaScript/tasks.js"></script>
    <script src="javaScript/timer.js"></script>
    <script src="javaScript/utils.js"></script>
    <script src="javaScript/workHours.js"></script>

</body>
</html>
